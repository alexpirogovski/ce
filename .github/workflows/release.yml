name: Release Charts

on:
  push:
    branches:
      - development
      - use_chart_version_output

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.chart_release.outputs.chart_version }}  # Capture chart version for later use

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v1
        with:
          version: "v3.9.1"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Add Helm Repos
        run: |
          helm repo add stable https://charts.helm.sh/stable
          helm repo add nuclio https://nuclio.github.io/nuclio/charts
          helm repo add v3io-stable https://v3io.github.io/helm-charts/stable
          helm repo add minio https://charts.min.io/
          helm repo add spark-operator https://kubeflow.github.io/spark-operator
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts

      - name: Run chart-releaser
        id: chart_release  # Assign an ID so we can capture its outputs
        uses: helm/chart-releaser-action@v1.1.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  notify_mlefi:
    runs-on: ubuntu-latest
    needs: release  # Ensure this runs after the release job
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensure full history for tag retrieval

      - name: Use Chart Version from Release Job
        run: echo "CHART_VERSION=${{ needs.release.outputs.chart_version }}" >> $GITHUB_ENV

      - name: Debug CHART_VERSION
        run: |
          echo "CHART_VERSION is: '$CHART_VERSION'"

      - name: Send repository dispatch event
        run: |
          JSON_PAYLOAD=$(jq -n --arg tag "$CHART_VERSION" --arg target "community" --arg platform "linux" --arg debug "no" \
            '{event_type: "helm-release", client_payload: {target_type: $target, tag_name: $tag, platform: $platform, debug: $debug}}')

          echo "Sending JSON: $JSON_PAYLOAD"

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.MLEFIGHTRIGGER }}" \
            https://api.github.com/repos/iguazio/mlefi/dispatches \
            -d "$JSON_PAYLOAD"